<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Amazing Digital Circus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Caine overlay — portrait video centered on top of banner */
    #caine {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 100vh;
      width: auto;
      max-width: 100vw;
      z-index: 10;
    }

    #ending {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 20;
      display: none;
      background: #000;
    }
  </style>
</head>
<body>

  <img id="bg" src="1780638988384_image.png" alt="">
  <video id="caine"  src="caine.mp4"  autoplay playsinline muted></video>
  <video id="ending" src="ending.mp4" playsinline></video>

  <script>
    const caine  = document.getElementById('caine');
    const ending = document.getElementById('ending');

    caine.addEventListener('ended', () => {
      caine.style.display = 'none';
      ending.style.display = 'block';

      const req = ending.requestFullscreen
        || ending.webkitRequestFullscreen
        || ending.mozRequestFullScreen;

      if (req) req.call(ending).catch(() => {});

      ending.play().catch(() => {});
    });
  </script>

</body>
</html>
